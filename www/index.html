<!DOCTYPE html><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Shadow Hunter</title>
<link rel=manifest href=manifest.json><meta name=theme-color content="#0e101a">
<style>html,body{margin:0;height:100%;background:#0e101a;overflow:hidden;touch-action:none;user-select:none}canvas{display:block;width:100%;height:100%}</style>
<canvas id=c></canvas>
<script>
const W=1280,H=720,c=document.getElementById('c'),g=c.getContext('2d'),lc=document.createElement('canvas'),lg=lc.getContext('2d');lc.width=W;lc.height=H;
let sw,sh,sc,ox,oy;
function rs(){const d=devicePixelRatio||1;sw=innerWidth;sh=innerHeight;c.width=sw*d;c.height=sh*d;sc=Math.min(sw/W,sh/H);ox=(sw-W*sc)/2;oy=(sh-H*sc)/2;g.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
const MOB='ontouchstart'in window,id=(Math.random()*1e9|0)+1,PI=Math.PI,R=(a,b)=>a+Math.random()*(b-a),wrap=a=>((a+PI)%(2*PI)+2*PI)%(2*PI)-PI,hyp=Math.hypot;
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// ---- save / data ----
let SV={coins:0,own:[1,0,0,0],eq:0};try{Object.assign(SV,JSON.parse(localStorage.sh||'{}'))}catch(e){}
const save=()=>{try{localStorage.sh=JSON.stringify(SV)}catch(e){}};
SV.st=Object.assign({mv:.6,sv:.8,q:1,mm:1},SV.st);SV.cos=Object.assign({skin:0,hair:0,outfit:0,hat:0},SV.cos);SV.oc=SV.oc||{};SV.armor=SV.armor||0;SV.name=SV.name||'';SV.stat=Object.assign({k:0,b:0,l:0,g:0},SV.stat);SV.best=Object.assign({s:0,t:0},SV.best);SV.ach=SV.ach||{};let VOL=SV.st.sv;
const WP=[{n:'Pistol',d:25,cd:.28,s:700,p:1,sp:.02,l:1.2,c:0},{n:'SMG',d:14,cd:.09,s:750,p:1,sp:.12,l:1,c:150},{n:'Shotgun',d:14,cd:.75,s:640,p:6,sp:.4,l:.45,c:300},{n:'Rifle',d:70,cd:.7,s:1100,p:1,sp:0,l:1.5,c:450}];
const ET={runner:{hp:40,r:11,sp:150,rg:300,fov:.8,cd:99,bd:0,bs:0,c1:'#2ecc71',c2:'#0b3a1f'},guard:{hp:50,r:12,sp:60,rg:300,fov:.6,cd:.9,bd:25,bs:430,c1:'#e63c46',c2:'#3a1218'},heavy:{hp:150,r:17,sp:42,rg:280,fov:.7,cd:.55,bd:18,bs:380,c1:'#4a6cd4',c2:'#16204a'},sniper:{hp:50,r:12,sp:38,rg:520,fov:.3,cd:1.8,bd:50,bs:850,c1:'#b060e0',c2:'#2a1240'},boss:{hp:900,r:30,sp:50,rg:800,fov:7,cd:1.1,bd:20,bs:420,c1:'#ff8a2a',c2:'#40200a'}};
const TH=[['#10131f','#343c5c','#6e7db9'],['#1f1013','#5c3434','#b97e6e'],['#0f1f17','#2f5c46','#6eb98e'],['#1a1026','#4a345c','#a06eb9']],TC=['#ff5a5a','#4aa8ff'];
// ---- audio (synthesised, no files) ----
let AC,mute=0;const ac=()=>{if(!AC)try{AC=new(window.AudioContext||webkitAudioContext)()}catch(e){}return AC};
function tone(f,d,ty,v,sl){const a=ac();if(!a||mute)return;v*=VOL;const o=a.createOscillator(),k=a.createGain(),t=a.currentTime;o.type=ty;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+sl),t+d);k.gain.setValueAtTime(v,t);k.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(k).connect(a.destination);o.start();o.stop(t+d)}
function noise(d,v){const a=ac();if(!a||mute)return;v*=VOL;const n=a.sampleRate*d|0,b=a.createBuffer(1,n,a.sampleRate),o=b.getChannelData(0);for(let i=0;i<n;i++)o[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),k=a.createGain();k.gain.value=v;s.buffer=b;s.connect(k).connect(a.destination);s.start()}
const sfx={shot:i=>{noise(.07,.07);tone([320,260,160,500][i],.1,'sawtooth',.04,-150)},eshot:()=>tone(180,.12,'square',.03,-100),hit:()=>tone(520,.05,'square',.03),kill:()=>{noise(.18,.1);tone(300,.2,'sawtooth',.05,-250)},hurt:()=>{noise(.12,.12);tone(120,.15,'square',.06,-60)},pick:()=>{tone(660,.08,'triangle',.07);setTimeout(()=>tone(990,.1,'triangle',.07),70)},boom:()=>{noise(.5,.2);tone(90,.5,'sawtooth',.1,-60)},no:()=>tone(130,.15,'square',.05)};
let mi=0;const BS=[55,55,65,55,73,55,65,49],AR=[220,262,330,262,392,330,262,220];
setInterval(()=>{if(mute||!AC)return;mi++;VOL=SV.st.mv;tone(BS[mi%8],.16,'triangle',.05);if(mi%2)tone(AR[mi%8]*(mi%16>7?1.5:1),.1,'square',.012);VOL=SV.st.sv},170);
// ---- world ----
let walls=[],th=TH[0];
function mk(seed,ty){const r=rng(seed);walls=[];ty=ty||0;
 if(ty==1){for(let i=0;i<5;i++)for(let j=0;j<3;j++)if((i+j)%2==0)walls.push({x:170+i*220,y:110+j*220,w:70,h:70})}
 else if(ty==2)walls.push({x:560,y:140,w:160,h:40},{x:560,y:540,w:160,h:40},{x:300,y:340,w:40,h:40},{x:940,y:340,w:40,h:40},{x:200,y:150,w:120,h:40},{x:960,y:530,w:120,h:40},{x:960,y:150,w:120,h:40},{x:200,y:530,w:120,h:40});
 else if(ty==3){for(let i=1;i<4;i++)walls.push({x:i*320-20,y:0,w:40,h:230+r()*40},{x:i*320-20,y:430+r()*40,w:40,h:300})}
 else for(let i=0;i<9;i++)walls.push({x:80+r()*(W-340),y:60+r()*(H-180),w:60+r()*160,h:30+r()*40})}
const solid=(p,r)=>p.x<r||p.y<r||p.x>W-r||p.y>H-r||walls.some(b=>p.x+r>b.x&&p.x-r<b.x+b.w&&p.y+r>b.y&&p.y-r<b.y+b.h);
function step(p,dx,dy,r){let x=p.x,y=p.y;if(!solid({x:x+dx,y},r))x+=dx;if(!solid({x,y:y+dy},r))y+=dy;return{x,y}}
const spot=(r=24,x0=40,x1=W-40)=>{for(;;){const p={x:R(x0,x1),y:R(40,H-40)};if(!solid(p,r))return p}};
const spotFar=r=>{let p;do p=spot(r);while(hyp(p.x-60,p.y-360)<300);return p};
const ray=(p,a,m)=>{const dx=Math.cos(a),dy=Math.sin(a);let t=0;while(t<m&&!solid({x:p.x+dx*t,y:p.y+dy*t},0))t+=6;return t};
let mode=0,level=1,kills=0,hp=100,shd=0,inv=0,spd=0,rap=0,me={x:60,y:360},ang=0,cd=0,tick=0,en=[],bl=[],pk=[],P=[],peers={},ts=[0,0],ks={},win=null,wt=0,myTeam=0,es=null,msg='',banner=null,shake=0,flash=0,tt=0,moving=0;
let BASE='',hostIp='',gm=0,tl=0,spT=0,gr=[],dsh=0,dcd=0,gcd=0,dvx=1,dvy=0,lmx=0,lmy=0,tip0=0,toast=null,lsp=[],lpk={};
const mkE=(k,p)=>{const T=ET[k];return{k,x:p.x,y:p.y,a:R(0,6.28),goal:spot(),alert:0,cd:1,hp:T.hp,mhp:T.hp,r:T.r,hit:0,lx:0,ly:0,ph:0,t:0,sees:0}};
function lvl(){th=TH[level%4];const boss=level%5==0;if(gm==1)mk(5,1);else if(boss){mk(level*31);walls=walls.slice(0,3)}else mk(level*7919,level%4);
 me={x:60,y:360};bl=[];pk=[];en=[];const n=Math.min(2+level,10);
 if(boss){{const b=mkE('boss',spotFar(40));if(level%10==0){b.hp=b.mhp=1500;b.v=1}en.push(b)}for(let i=0;i<2;i++)en.push(mkE('guard',spotFar()))}
 else{const sn=Math.floor((level-1)/3),hv=Math.floor(level/3);for(let i=0;i<n;i++)en.push(mkE(i<sn?'sniper':i<sn+hv?'heavy':i<sn+hv+(level>1?Math.floor(level/2):0)?'runner':'guard',spotFar()))}
 banner={t:boss?'BOSS FIGHT!':'LEVEL '+level,l:1.8}}
const mkb=(x,y,a,sp,o,l,d,tm)=>({x:x+Math.cos(a)*16,y:y+Math.sin(a)*16,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,o,l,d,tm});
function burst(x,y,n,col,sp){for(let i=0;i<n&&P.length<300;i++){const a=R(0,6.28),s=R(.2,1)*sp;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5,m:.5,c:col})}}
function hurt(n,by,tm){if(inv>0)return;n*=1-ARM[SV.armor];if(shd>0){shd-=n;n=shd<0?-shd:0;if(shd<0)shd=0}hp-=n;shake=6;burst(me.x,me.y,8,'#e33',160);sfx.hurt();
 if(hp<=0){if(mode==1){endRun()}else{post({t:'K',k:by,kt:tm,id});hp=100;me=spot(24,myTeam?980:40,myTeam?1240:300);inv=1.5}}}
function die(e){e.dead=1;const b=e.k=='boss';burst(e.x,e.y,b?60:18,ET[e.k].c1,260);sfx.kill();shake=b?14:4;SV.coins+=b?100:e.alert>0?10:15;save();
 if(!b&&Math.random()<.3)pk.push({x:e.x,y:e.y,t:'hsrb'[Math.random()*4|0],l:12});kills++;prog('kill',1);if(b)prog('boss',1);for(const o of en)if(!o.dead&&o.alert<=0&&hyp(o.x-e.x,o.y-e.y)<520){o.alert=6;o.lx=e.x;o.ly=e.y}}
function shoot(){const w=WP[SV.eq],as=[];for(let i=0;i<w.p;i++)as.push(ang+(Math.random()-.5)*w.sp*2);
 for(const a of as)bl.push(mkb(me.x,me.y,a,w.s,id,w.l,w.d,myTeam));
 if(mode==2)post({t:'F',id,x:me.x,y:me.y,as,w:SV.eq,tm:myTeam});
 cd=w.cd*(rap>0?.5:1);flash=.08;shake=Math.max(shake,w.p>1?5:2);sfx.shot(SV.eq);
 if(mode==1)for(const e of en)if(e.alert<=0&&hyp(e.x-me.x,e.y-me.y)<450){e.alert=4;e.lx=me.x;e.ly=me.y}}
// ---- LAN ----
function post(o){if(es)fetch(BASE+'/s',{method:'POST',body:JSON.stringify(o),keepalive:true}).catch(()=>{})}
function join(){hostIp='';if(!BASE)fetch('/ip').then(r=>r.text()).then(t=>hostIp=t).catch(()=>{});mk(77);th=TH[0];{const r=rng(99);lsp=[];lpk={};while(lsp.length<6){const p={x:80+r()*(W-160),y:60+r()*(H-120)};if(!solid(p,24))lsp.push(p)}}myTeam=0;hp=100;inv=1.5;peers={};ts=[0,0];ks={};win=null;es=new EventSource(BASE+'/events');
 es.onmessage=e=>{const m=JSON.parse(e.data);
  if(m.t==='T'){myTeam=m.team;me=spot(24,myTeam?980:40,myTeam?1240:300);return}
  if(m.id===id&&m.t!=='K')return;
  if(m.t==='S'){const p=peers[m.id];if(p){p.tx=m.x;p.ty=m.y;p.a=m.a;p.h=m.h;p.nm=m.nm;p.seen=performance.now()}else peers[m.id]={nm:m.nm,x:m.x,y:m.y,tx:m.x,ty:m.y,a:m.a,tm:m.tm,h:m.h,seen:performance.now()}}
  else if(m.t==='F'){for(const a of m.as)bl.push(mkb(m.x,m.y,a,WP[m.w].s,m.id,WP[m.w].l,WP[m.w].d,m.tm));sfx.eshot()}
  else if(m.t==='U')lpk[m.i]=m.k;else if(m.t==='X')delete lpk[m.i];else if(m.t==='G'){burst(m.x,m.y,50,'#fa3',320);sfx.boom();if(m.tm!==myTeam&&hyp(m.x-me.x,m.y-me.y)<100)hurt(60,m.id,m.tm)}
  else if(m.t==='K'){ts[m.kt]=(ts[m.kt]||0)+1;ks[m.k]=(ks[m.k]||0)+1;if(m.k===id){SV.coins+=20;save()}if(ts[m.kt]>=20&&win==null){win=m.kt;wt=4;sfx.pick()}}};
 es.onerror=()=>{msg='Connection lost to host'}}
function leave(){gr=[];lpk={};mode=0;if(es){es.close();es=null}peers={};bl=[];msg=''}
// ---- input ----
const keys={};let mouse={x:0,y:0,d:0},Tc={};
const tw=(x,y)=>({x:(x-ox)/sc,y:(y-oy)/sc});
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code=='Escape'&&mode)leave();if(!e.repeat&&e.code=='Space')dash();if(!e.repeat&&e.code=='KeyG')grenade()});
addEventListener('keyup',e=>keys[e.code]=0);
addEventListener('pointermove',e=>{Object.assign(mouse,tw(e.clientX,e.clientY));if(Tc[e.pointerId])Tc[e.pointerId]={x:e.clientX,y:e.clientY}});
c.addEventListener('pointerdown',e=>{ac()&&AC.resume();mouse.d=1;Object.assign(mouse,tw(e.clientX,e.clientY));Tc[e.pointerId]={x:e.clientX,y:e.clientY};click(e.clientX,e.clientY)});
for(const ev of['pointerup','pointercancel'])addEventListener(ev,e=>{mouse.d=0;delete Tc[e.pointerId]});
function stick(cx,cy){for(const t of Object.values(Tc)){let dx=t.x-cx,dy=t.y-cy;if(hyp(dx,dy)<170){dx/=90;dy/=90;const m=hyp(dx,dy);if(m>1){dx/=m;dy/=m}return{x:dx,y:dy}}}return null}
function btns(){const cx=sw/2,u=Math.min(1,sh/600),w=300,h=62*u;
 if(mode==0){const bw=Math.min(250,sw/2-20);return[['solo','CAMPAIGN','#1e7850'],['surv','SURVIVAL','#8a2a2a'],['tatk','TIME ATTACK','#7a5a10'],['lan','LAN BATTLE','#2850a0'],['arm','ARMORY','#6a3a8a'],['cos','WARDROBE','#2a7a8a']].map((b,i)=>({k:b[0],t:b[1],col:b[2],x:cx+(i%2?10:-bw-10),y:sh*.36+(i>>1)*h*1.25,w:bw,h}))}
 if(mode==3){const cw=Math.min(210,(sw-60)/4-10),x0=cx-(cw*4+30)/2;return[...WP.map((q,i)=>({k:'w'+i,x:x0+i*(cw+10),y:sh*.22,w:cw,h:Math.min(sh*.55,380)})),{k:'back',t:'BACK',col:'#444',x:cx-70,y:sh-80,w:140,h:52}]}return btns2()}
const hit=(r,x,y)=>x>r.x&&x<r.x+r.w&&y>r.y&&y<r.y+r.h;
function click(x,y){if(hyp(x-(sw-96),y-40)<26){mute^=1;return}if(mode==0&&hyp(x-(sw-152),y-40)<26){mode=5;return}if(mode==0&&hyp(x-(sw-208),y-40)<26){mode=6;return}
 if(mode==1||mode==2){if(hyp(x-(sw-40),y-40)<26)leave();else if(hyp(x-(sw-340),y-(sh-70))<36)dash();else if(hyp(x-(sw-340),y-(sh-170))<36)grenade();return}
 const b=btns().find(r=>hit(r,x,y));if(!b)return;msg='';
 if(b.k=='solo'||b.k=='surv'||b.k=='tatk'){gm=b.k=='surv'?1:b.k=='tatk'?2:0;mode=1;myTeam=0;tip0=tt;spT=2;startRun()}
 else if(b.k=='lan'){if(location.port=='3000')BASE='';else{const h=prompt('Host address (shown on the host PC), e.g. 192.168.1.5',SV.host||'');if(!h)return;SV.host=h.trim();save();BASE='http://'+SV.host.replace(/^https?:\/\//,'').replace(/:\d+$/,'')+':3000'}mode=2;join()}
 else if(b.k=='arm')mode=3;else if(b.k=='back')mode=0;
 else if(b.k=='cos'){mode=4;pv=Object.assign({},SV.cos,{armor:SV.armor})}
 else if(b.k=='nm'){const n=prompt('Your name (max 10 letters)',SV.name||'');if(n!=null){SV.name=n.replace(/[^\w ]/g,'').slice(0,10);save()}}
 else if(b.k.slice(0,2)=='T:'){const k=b.k.slice(2);if(k=='mv'||k=='sv')SV.st[k]=((Math.round(SV.st[k]*4)+1)%5)/4;else SV.st[k]^=1;VOL=SV.st.sv;save();sfx.hit()}
 else if(b.k.includes(':')){const[a,k]=b.k.split(':'),n=LS[k].length;if(a=='L')pv[k]=(pv[k]+n-1)%n;else if(a=='R')pv[k]=(pv[k]+1)%n;else{const i=pv[k],it=LS[k][i];if(!owned(k,i)){if(SV.coins>=it[2]){SV.coins-=it[2];SV.oc[k+i]=1;sfx.pick()}else{msg='Not enough coins';sfx.no();return}}if(k=='armor')SV.armor=i;else SV.cos[k]=i;save()}}
 else if(b.k[0]=='w'){const i=+b.k[1];if(!SV.own[i]){if(SV.coins>=WP[i].c){SV.coins-=WP[i].c;SV.own[i]=1;SV.eq=i;save();sfx.pick()}else{msg='Not enough coins';sfx.no()}}else{SV.eq=i;save();sfx.hit()}}}
// ---- update ----
function upd(dt){
 let mx=(keys.KeyD?1:0)-(keys.KeyA?1:0),my=(keys.KeyS?1:0)-(keys.KeyW?1:0),fire=false,aimed=false;
 if(MOB){const s=stick(130,sh-130);if(s){mx=s.x;my=s.y}const a=stick(sw-130,sh-130);if(a&&hyp(a.x,a.y)>.25){ang=Math.atan2(a.y,a.x);aimed=true;fire=hyp(a.x,a.y)>.6}}
 else{ang=Math.atan2(mouse.y-me.y,mouse.x-me.x);aimed=true;fire=mouse.d}
 const l=hyp(mx,my);if(l>1){mx/=l;my/=l}moving=l>.1;lmx=mx;lmy=my;
 if(moving&&!aimed)ang=Math.atan2(my,mx);
 const v=210*(spd>0?1.5:1)*dt;me=step(me,mx*v,my*v,12);if(dsh>0)me=step(me,dvx*900*dt,dvy*900*dt,12);cd-=dt;dcd-=dt;gcd-=dt;dsh-=dt;inv-=dt;spd-=dt;rap-=dt;flash-=dt;shake=Math.max(0,shake-dt*30);
 if(fire&&cd<=0&&!(mode==2&&win!=null))shoot();
 if(banner&&(banner.l-=dt)<=0)banner=null;if(toast&&(toast.l-=dt)<=0)toast=null;
 if(mode==1){
  for(const e of en){const Tt=ET[e.k],tx=me.x-e.x,ty=me.y-e.y,d=hyp(tx,ty),ta=Math.atan2(ty,tx);
   e.sees=d<Tt.rg&&(e.k=='boss'||Math.abs(wrap(ta-e.a))<Tt.fov)&&(e.k=='boss'||ray(e,ta,d)>=d-1);e.cd-=dt;e.hit-=dt;
   if(e.sees){e.alert=2.5;e.lx=me.x;e.ly=me.y}
   if(e.k=='boss'){e.t+=dt;if(e.hp<e.mhp/2&&!e.ph){e.ph=1;for(let i=0;i<2;i++)en.push(mkE('guard',spot()));banner={t:'ENRAGED!',l:1.2};sfx.boom()}
    if(e.t>3.2){e.t=0;for(let i=0;i<(e.v?18:12);i++)bl.push(mkb(e.x,e.y,i*PI/(e.v?9:6)+(e.v?tt:0),260,0,3,18,9));sfx.boom()}if(d<e.r+14)hurt(30*dt,0,9)}
   const sp=Tt.sp*(e.ph?1.6:1)*dt;
   if(e.alert>0){e.alert-=dt;if(e.alert<=0)e.goal={x:e.lx,y:e.ly};
    const fa=e.sees?ta:Math.atan2(e.ly-e.y,e.lx-e.x);e.a+=Math.max(-8*dt,Math.min(8*dt,wrap(fa-e.a)));
    const keep=e.k=='sniper'?400:e.k=='boss'?240:e.k=='runner'?0:140;
    if(e.sees?d>keep:hyp(e.lx-e.x,e.ly-e.y)>10){const q=step(e,Math.cos(e.a)*sp,Math.sin(e.a)*sp,e.r);e.x=q.x;e.y=q.y}
    if(e.sees&&e.cd<=0&&Tt.bs){e.cd=Tt.cd*(e.ph?.6:1);const n=e.k=='heavy'||e.k=='boss'?3:1;for(let i=0;i<n;i++)bl.push(mkb(e.x,e.y,ta+(i-(n-1)/2)*.18,Tt.bs,0,2,Tt.bd,9));sfx.eshot()}}
   else{const gx=e.goal.x-e.x,gy=e.goal.y-e.y;e.a+=Math.max(-3*dt,Math.min(3*dt,wrap(Math.atan2(gy,gx)-e.a)));
    const q=step(e,Math.cos(e.a)*sp,Math.sin(e.a)*sp,e.r);if(hyp(gx,gy)<12||(q.x==e.x&&q.y==e.y))e.goal=spot();e.x=q.x;e.y=q.y}
   if(e.k=='runner'&&e.alert>0){if(d<e.r+14)hurt(40*dt,0,9)}else if(e.k!='boss'&&d<e.r+14)die(e)}
